  build-channel-repo:
    name: Repo (${{ matrix.channel }})
    needs: detect-channels
    if: needs.detect-channels.outputs.has_channels == 'true'
      # &&
      # (github.event_name != 'workflow_dispatch' || inputs.reindex_only != true) &&
      # (github.event_name != 'workflow_dispatch' || inputs.rebuild_rgtk2 != true)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.detect-channels.outputs.channels) }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_COMPILE_AND_INSTALL_PACKAGES: "never"
      TZ: "Pacific/Auckland"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      INZIGHT_CI: "1"
      INZIGHT_CHANNEL: ${{ matrix.channel }}
      INZIGHT_BUILDER_ROOT: ${{ github.workspace }}
      # Job-level env cannot use ${{ env.* }}; keep in sync with workflow env.INZIGHT_CRAN_REPO.
      INZIGHT_REPO_BASE: https://r.docker.stat.auckland.ac.nz
      INZIGHT_BINARY_REPO: https://r.docker.stat.auckland.ac.nz
      GTK_PATH: "D:/a/_temp/GTK/x64"
      INZIGHT_GTK64_ROOT: "D:/a/_temp/GTK/x64"
      INZIGHT_RGTK2_SOURCE: ${{ github.workspace }}/src/RGtk2/RGtk2
      INZIGHT_CAIRODEVICE_SOURCE: ${{ github.workspace }}/library/cairoDevice


    steps:
      - uses: actions/checkout@v5

      - name: Checkout build submodules
        shell: bash
        run: bash scripts/init_build_submodules.sh

      - name: Read channel R version
        id: channel-meta
        shell: bash
        run: |
          R_VER=$(grep '^r_version:' "channels/${INZIGHT_CHANNEL}.deps" | sed 's/.*"\(.*\)".*/\1/')
          RTOOLS=$(grep '^rtools:' "channels/${INZIGHT_CHANNEL}.deps" | sed 's/.*"\(.*\)".*/\1/')
          echo "r_version=${R_VER}" >> "$GITHUB_OUTPUT"
          echo "rtools=${RTOOLS}" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.channel-meta.outputs.r_version }}
          rtools-version: ${{ steps.channel-meta.outputs.rtools }}
          use-public-rspm: true
          extra-repositories: ${{ env.INZIGHT_CRAN_REPO }}

      - uses: r-lib/actions/setup-pandoc@v2

      # Runtime (+ headers if source fallback compiles). Laid into RGtk2/gtk by install_rgtk2_ci.R.
      - name: Install GTK runtime and configure
        run: |
          curl -L -o gtk.zip https://ftp.gnome.org/pub/gnome/binaries/win64/gtk+/2.22/gtk+-bundle_2.22.1-20101229_win64.zip
          md D:\a\_temp\GTK
          7z x gtk.zip -ox64 > nul
          del gtk.zip
          cp -r x64 ${{ env.GTK_PATH }}
          echo "${{ env.GTK_PATH }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install RGtk2 and cairoDevice
        run: Rscript scripts/install_rgtk2_ci.R

      - name: Check RGtk2
        run: Rscript -e "library(RGtk2); gtkWindowNew()"

      - name: Verify gWidgets submodules visible to R
        run: Rscript scripts/verify_library_submodules.R

      - name: Install channel library packages (gWidgets)
        run: Rscript scripts/channel_library.R --install

      - name: Install channel packages
        run: Rscript scripts/install_channel.R --channel=${{ matrix.channel }}

      - name: Build channel library win.binaries
        run: Rscript scripts/channel_library.R --build --channel=${{ matrix.channel }}

      - name: Build channel win.binaries
        run: Rscript scripts/build_binaries.R --channel=${{ matrix.channel }}

      # Re-zip installed packages into channel staging (no compile; source only if
      # install_rgtk2_ci.R fell back because win.binary was missing from the repo).
      - name: Stage RGtk2 and cairoDevice win.binaries
        run: Rscript scripts/build_rgtk2_channel.R --channel=${{ matrix.channel }}

      - name: Stage channel repository
        if: ${{ !contains(github.event.head_commit.message, 'skip repo') }}
        shell: bash
        run: |
          set -euo pipefail
          R_MINOR=$(Rscript rversion.R)
          SRC="staging/${INZIGHT_CHANNEL}/bin/windows/contrib/${R_MINOR}"
          DEST="tmp/${INZIGHT_CHANNEL}/bin/windows/contrib/tmp${R_MINOR}"
          echo "SRC: $SRC"
          ls -la "$SRC"
          mkdir -p "$DEST"
          if [ ! -d "$SRC" ]; then
            echo "ERROR: build output missing: $SRC" >&2
            find staging -type f 2>/dev/null | head -20 >&2 || true
            exit 1
          fi
          cp -a "$SRC/." "$DEST/"
          echo "Staged $(find "$DEST" -maxdepth 1 -name '*.zip' | wc -l) zip(s) and PACKAGES:"
          ls -la "$DEST"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Generate AWS credentials
        shell: bash
        run: |
          python aws_saml_login.py \
            --user ${{ secrets.AWS_USER }} \
            --password ${{ secrets.AWS_PASS }} \
            --token ${{ secrets.AWS_TOKEN }} \
            --idp iam.auckland.ac.nz

      - name: Upload channel repository (staging)
        if: ${{ !contains(github.event.head_commit.message, 'skip repo') }}
        shell: bash
        run: |
          set -euo pipefail
          R_MINOR=$(Rscript rversion.R)
          LOCAL="tmp/${INZIGHT_CHANNEL}/bin/windows/contrib/tmp${R_MINOR}"
          S3_URI="s3://${{ env.INZIGHT_S3_BUCKET }}/${INZIGHT_CHANNEL}/bin/windows/contrib/tmp${R_MINOR}"
          if [ ! -f "${LOCAL}/PACKAGES" ]; then
            echo "ERROR: ${LOCAL}/PACKAGES missing — refusing to upload empty repo" >&2
            exit 1
          fi
          N_ZIPS=$(find "${LOCAL}" -maxdepth 1 -name '*.zip' | wc -l)
          if [ "${N_ZIPS}" -eq 0 ]; then
            echo "ERROR: no .zip files in ${LOCAL}" >&2
            exit 1
          fi
          echo "Uploading ${N_ZIPS} package(s) to ${S3_URI}"
          aws --profile saml s3 sync --delete "${LOCAL}/" "${S3_URI}/"
          aws --profile saml s3 ls "${S3_URI}/" | head -20 || true

      - name: Record channel build hash
        if: >-
          success() &&
          !contains(github.event.head_commit.message, 'skip repo')
        shell: bash
        run: |
          HASH=$(Rscript -e "source('channels/_shared.R'); cat(hash_channel_inputs('${INZIGHT_CHANNEL}'))")
          echo "$HASH" | aws --profile saml s3 cp - "s3://${{ env.INZIGHT_S3_BUCKET }}/channels/${INZIGHT_CHANNEL}.last-built"

  build-channel-installer:
    name: Installer (${{ matrix.channel }})
    needs: [detect-channels, build-channel-repo, promote-repos]
    if: >-
      needs.detect-channels.outputs.has_channels == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.reindex_only != true) &&
      (github.event_name != 'workflow_dispatch' || inputs.rebuild_rgtk2 != true) &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_installer != true) &&
      !contains(github.event.head_commit.message, 'skip installer') &&
      !contains(github.event.head_commit.message, 'skip repo') &&
      needs.build-channel-repo.result == 'success' &&
      needs.promote-repos.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.detect-channels.outputs.channels) }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_COMPILE_AND_INSTALL_PACKAGES: "never"
      TZ: "Pacific/Auckland"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      INZIGHT_CI: "1"
      # Job-level env cannot use ${{ env.* }}; keep in sync with workflow env.INZIGHT_CRAN_REPO.
      INZIGHT_REPO_BASE: https://r.docker.stat.auckland.ac.nz
      INZIGHT_BINARY_REPO: https://r.docker.stat.auckland.ac.nz
      INZIGHT_CHANNEL: ${{ matrix.channel }}

    steps:
      - uses: actions/checkout@v5

      - name: Checkout submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 installers/win-installer

      - name: Read channel R version
        id: channel-meta
        shell: bash
        run: |
          R_VER=$(grep '^r_version:' "channels/${INZIGHT_CHANNEL}.deps" | sed 's/.*"\(.*\)".*/\1/')
          RTOOLS=$(grep '^rtools:' "channels/${INZIGHT_CHANNEL}.deps" | sed 's/.*"\(.*\)".*/\1/')
          echo "r_version=${R_VER}" >> "$GITHUB_OUTPUT"
          echo "rtools=${RTOOLS}" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.channel-meta.outputs.r_version }}
          rtools-version: ${{ steps.channel-meta.outputs.rtools }}
          use-public-rspm: true
          extra-repositories: ${{ env.INZIGHT_CRAN_REPO }}

      - uses: r-lib/actions/setup-pandoc@v2

      # win.binary only from promoted channel + flat repo (never compiles RGtk2).
      - name: Install channel packages from promoted repos
        run: Rscript scripts/install_channel_from_repo.R --channel=${{ matrix.channel }}

      - name: Install GTK runtime for RGtk2
        run: |
          curl -L -o gtk.zip https://ftp.gnome.org/pub/gnome/binaries/win64/gtk+/2.22/gtk+-bundle_2.22.1-20101229_win64.zip
          md D:\a\_temp\GTK
          7z x gtk.zip -ox64 > nul
          del gtk.zip
          md ${{ env.R_LIBS_USER }}\RGtk2\gtk
          cp -r x64 ${{ env.R_LIBS_USER }}\RGtk2\gtk\x64
          echo "${{ env.R_LIBS_USER }}\RGtk2\gtk\x64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check RGtk2, cairoDevice, and iNZight
        run: Rscript -e "library(RGtk2); gtkWindowNew(); library(cairoDevice); library(iNZight)"

      - name: Set installer version
        id: inzight
        run: echo "version=$(Rscript scripts/channel_version.R --channel=${{ matrix.channel }})" >> "$env:GITHUB_OUTPUT"

      - name: Move R and library to build location
        working-directory: installers/win-installer
        run: |
          cp -R C:/R R
          cp -R ${{ env.R_LIBS_USER }} library

      - name: Configure R GUI
        working-directory: installers/win-installer
        run: R\bin\Rscript.exe rgui_settings.R

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "NSIS"),
            (Join-Path $env:ProgramFiles "NSIS")
          )
          $nsis = $candidates | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if (-not $nsis) { throw "makensis.exe not found after NSIS install" }
          echo $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        working-directory: installers/win-installer
        run: makensis.exe inzight_installer.nsi
        env:
          INSTALLER_VERSION: ${{ steps.inzight.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.6"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --use-feature=2020-resolver -r ./requirements.txt

      - name: Generate AWS credentials
        run: |
          python aws_saml_login.py `
            --user ${{ secrets.AWS_USER }} `
            --password ${{ secrets.AWS_PASS}} `
            --token ${{ secrets.AWS_TOKEN }} `
            --idp iam.auckland.ac.nz

      - name: Upload installer artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.inzight.outputs.version }}"
          CHANNEL="${INZIGHT_CHANNEL}"
          EXE="installers/win-installer/iNZightVIT-installer.exe"
          BUCKET="${{ env.INZIGHT_S3_BUCKET }}"
          aws --profile saml s3 sync \
            --exclude '*' --exclude '!*.html' --exclude '!VERSION*' \
            "s3://${BUCKET}/downloads" downloads || mkdir -p downloads
          mkdir -p downloads/Windows "downloads/${CHANNEL}"
          case "$CHANNEL" in
            development)
              DEST="downloads/iNZightVIT-installer-nightly.exe"
              cp "$EXE" "$DEST"
              echo "$VERSION" > downloads/VERSION-nightly
              ;;
            stable)
              DEST="downloads/Windows/iNZightVIT-installer-${VERSION}.exe"
              cp "$EXE" "$DEST"
              # Prod default stays pinned at 4.4.0 (new builds only land under Windows/).
              PINNED_VERSION="4.4.0"
              PINNED_EXE="downloads/Windows/iNZightVIT-installer-${PINNED_VERSION}.exe"
              aws --profile saml s3 cp \
                "s3://${BUCKET}/downloads/Windows/iNZightVIT-installer-${PINNED_VERSION}.exe" \
                "$PINNED_EXE"
              cp "$PINNED_EXE" "downloads/iNZightVIT-installer.exe"
              echo "$PINNED_VERSION" > downloads/VERSION
              ;;
            *)
              DEST="downloads/${CHANNEL}/iNZightVIT-installer-${VERSION}.exe"
              cp "$EXE" "$DEST"
              echo "$VERSION" > "downloads/${CHANNEL}/VERSION"
              ;;
          esac
          aws --profile saml s3 sync downloads "s3://${BUCKET}/downloads"
          aws --profile saml s3 ls "s3://${BUCKET}/downloads/" > downloads.txt
          aws --profile saml s3 ls "s3://${BUCKET}/downloads/Windows/" > downloads_Windows.txt
          Rscript create_index.R downloads downloads/Windows
          aws --profile saml s3 sync downloads "s3://${BUCKET}/downloads"

  # reindex-repos:
  #   name: Reindex package repositories
  #   # if: >-
  #   #   github.event_name == 'workflow_dispatch' &&
  #   #   inputs.reindex_only == true &&
