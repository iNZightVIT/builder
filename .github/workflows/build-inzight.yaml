    name: Detect channels to build
    # if: >-
    #   (github.event_name != 'workflow_dispatch' || inputs.reindex_only != true) &&
    #   (github.event_name != 'workflow_dispatch' || inputs.rebuild_rgtk2 != true)
    runs-on: ubuntu-24.04
    outputs:
      channels: ${{ steps.detect.outputs.channels }}
      has_channels: ${{ steps.detect.outputs.has_channels }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Generate AWS credentials
        if: github.event_name == 'schedule'
        run: |
          python aws_saml_login.py \
            --user ${{ secrets.AWS_USER }} \
            --password ${{ secrets.AWS_PASS }} \
            --token ${{ secrets.AWS_TOKEN }} \
            --idp iam.auckland.ac.nz

      - name: Detect channels
        id: detect
        env:
          INPUT_CHANNELS: ${{ github.event.inputs.channels }}
          INPUT_REBUILD_ALL: ${{ github.event.inputs.rebuild_all }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python scripts/detect_channels.py

