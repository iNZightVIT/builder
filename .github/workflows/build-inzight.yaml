    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.detect-channels.outputs.channels) }}
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_COMPILE_AND_INSTALL_PACKAGES: "never"
      TZ: "Pacific/Auckland"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      INZIGHT_CI: "1"
      # INZIGHT_BINARY_REPO: ${{ env.INZIGHT_CRAN_REPO }}
      INZIGHT_CHANNEL: ${{ matrix.channel }}


