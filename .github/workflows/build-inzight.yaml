  cleanup-after-fail:
    name: Clean up tmp repos on failure
    runs-on: ubuntu-24.04
    # needs: [detect-channels, build-channel-repo, promote-repos]
    needs: [detect-channels, build-channel-repo]
    # TODO: make this only run on failure once job working
    # if: failure()
    # (github.event_name != 'workflow_dispatch' || inputs.reindex_only != true)
    env:
      CHANNELS_JSON: ${{ needs.detect-channels.outputs.channels }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Generate AWS credentials
        run: |
          python aws_saml_login.py \
            --user ${{ secrets.AWS_USER }} \
            --password ${{ secrets.AWS_PASS }} \
            --token ${{ secrets.AWS_TOKEN }} \
            --idp iam.auckland.ac.nz

      - name: Remove tmp staging prefixes
        run: |
          python - <<'PY'
          import json, os, subprocess, yaml
          channels = json.loads(os.environ.get("CHANNELS_JSON") or "[]")
          for ch in channels:
              deps = yaml.safe_load(open(f"channels/{ch}.deps"))
              r_minor = deps["r_version"]
              key = f"s3://r.docker.stat.auckland.ac.nz/{ch}/bin/windows/contrib/tmp{r_minor}/"
              subprocess.run(
                  ["aws", "--profile", "saml", "s3", "rm", "--recursive", key],
                  check=False,
              )
          PY

