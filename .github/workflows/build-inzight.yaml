  promote-repos:
    name: Promote channel repositories
    needs: [detect-channels, build-channel-repo]
      # (github.event_name != 'workflow_dispatch' || inputs.reindex_only != true) &&
      # (github.event_name != 'workflow_dispatch' || inputs.rebuild_rgtk2 != true) &&
    if: >-
      needs.detect-channels.outputs.has_channels == 'true' &&
      needs.build-channel-repo.result == 'success'
    #  &&
      # !contains(github.event.head_commit.message, 'skip repo')
    runs-on: ubuntu-24.04
    env:
      CHANNELS_JSON: ${{ needs.detect-channels.outputs.channels }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Generate AWS credentials
        run: |
          python aws_saml_login.py \
            --user ${{ secrets.AWS_USER }} \
            --password ${{ secrets.AWS_PASS }} \
            --token ${{ secrets.AWS_TOKEN }} \
            --idp iam.auckland.ac.nz

      - name: Promote tmp repos, regenerate indexes, push to S3
        env:
          CHANNELS_JSON: ${{ needs.detect-channels.outputs.channels }}
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="${{ env.INZIGHT_S3_BUCKET }}"
          AWS=(aws --profile saml)

          for ch in $(echo "$CHANNELS_JSON" | jq -r '.[]'); do
            R_MINOR=$(grep '^r_version:' "channels/${ch}.deps" | sed 's/.*"\(.*\)".*/\1/')
            TMP="s3://${BUCKET}/${ch}/bin/windows/contrib/tmp${R_MINOR}"
            FINAL="s3://${BUCKET}/${ch}/bin/windows/contrib/${R_MINOR}"
            echo "=== promote ${ch}: tmp -> ${R_MINOR} ==="
            if ! "${AWS[@]}" s3 ls "${TMP}/PACKAGES" > /dev/null 2>&1; then
              echo "ERROR: ${TMP}/PACKAGES not on S3 — build upload may have failed" >&2
              "${AWS[@]}" s3 ls "${TMP}/" >&2 || echo "(tmp prefix empty or missing)" >&2
              exit 1
            fi
            "${AWS[@]}" s3 sync "${TMP}/" "${FINAL}/"
            n_objs=$("${AWS[@]}" s3 ls "${FINAL}/" | wc -l)
            echo "Promoted ${n_objs} object(s); first 20:"
            "${AWS[@]}" s3 ls "${FINAL}/" | head -20 || true
            "${AWS[@]}" s3 rm --recursive "${TMP}"
          done

          if echo "$CHANNELS_JSON" | jq -e 'index("stable")' > /dev/null; then
            echo "=== mirror stable/bin -> /bin ==="
            "${AWS[@]}" s3 sync "s3://${BUCKET}/stable/bin" "s3://${BUCKET}/bin"
          fi

          write_indexes() {
            local s3_bin="$1"
            local bin_dir="$2"
            local r_minor="$3"
            echo "Pull ${s3_bin} -> ${bin_dir}"
            rm -rf "${bin_dir}"
            mkdir -p "${bin_dir}"
            "${AWS[@]}" s3 cp --recursive "${s3_bin}/" "${bin_dir}/"
            local n_zips
            n_zips=$(find "${bin_dir}/windows/contrib/${r_minor}" -maxdepth 1 -name '*.zip' 2>/dev/null | wc -l)
            echo "Found ${n_zips} zip(s) under windows/contrib/${r_minor}"
            if [ "${n_zips}" -eq 0 ]; then
              echo "ERROR: no packages under ${bin_dir}/windows/contrib/${r_minor}" >&2
              find "${bin_dir}" -type f | head -20 >&2 || true
              exit 1
            fi
            python "${GITHUB_WORKSPACE}/create_webpages.py" --path "${bin_dir}"
            echo "Push index.html files to ${s3_bin}"
            "${AWS[@]}" s3 sync "${bin_dir}/" "${s3_bin}/" \
              --exclude '*' \
              --include '**/index.html'
          }

          for ch in $(echo "$CHANNELS_JSON" | jq -r '.[]'); do
            R_MINOR=$(grep '^r_version:' "channels/${ch}.deps" | sed 's/.*"\(.*\)".*/\1/')
            echo "=== index.html ${ch} ==="
            write_indexes \
              "s3://${BUCKET}/${ch}/bin" \
              "${GITHUB_WORKSPACE}/work/${ch}/bin" \
              "${R_MINOR}"
          done

          if echo "$CHANNELS_JSON" | jq -e 'index("stable")' > /dev/null; then
            echo "=== index.html /bin (flat) ==="
            write_indexes \
              "s3://${BUCKET}/bin" \
              "${GITHUB_WORKSPACE}/work/flat/bin" \
              "$(grep '^r_version:' channels/stable.deps | sed 's/.*"\(.*\)".*/\1/')"
          fi

      - name: Clear CloudFront cache
        run: |
          aws --profile saml cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_ID }} \
            --paths "/*"

  cleanup-after-fail:
    name: Clean up tmp repos on failure
    runs-on: ubuntu-24.04
    needs: [detect-channels, build-channel-repo, promote-repos]
    if: >-
      always() &&
      needs.detect-channels.outputs.has_channels == 'true' &&
      (needs.build-channel-repo.result == 'failure' ||
       needs.promote-repos.result == 'failure')
    env:
      CHANNELS_JSON: ${{ needs.detect-channels.outputs.channels }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Generate AWS credentials
        run: |
          python aws_saml_login.py \
            --user ${{ secrets.AWS_USER }} \
            --password ${{ secrets.AWS_PASS }} \
            --token ${{ secrets.AWS_TOKEN }} \
            --idp iam.auckland.ac.nz

      - name: Remove tmp staging prefixes
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="${{ env.INZIGHT_S3_BUCKET }}"
          AWS=(aws --profile saml)
          for ch in $(echo "$CHANNELS_JSON" | jq -r '.[]'); do
            R_MINOR=$(grep '^r_version:' "channels/${ch}.deps" | sed 's/.*"\(.*\)".*/\1/')
            echo "Remove ${ch} tmp${R_MINOR}"
            "${AWS[@]}" s3 rm --recursive \
              "s3://${BUCKET}/${ch}/bin/windows/contrib/tmp${R_MINOR}" \
              || true
          done

