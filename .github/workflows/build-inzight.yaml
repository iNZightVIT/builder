  #           --user ${{ secrets.AWS_USER }} \
  #           --password ${{ secrets.AWS_PASS }} \
  #           --token ${{ secrets.AWS_TOKEN }} \
  #           --idp iam.auckland.ac.nz

  #     - name: Pull repos and regenerate index.html
  #       env:
  #         INPUT_CHANNELS: ${{ github.event.inputs.channels }}
  #       run: python scripts/promote_repos.py --reindex-only

  #     - name: Clear CloudFront cache
  #       run: |
  #         aws --profile saml cloudfront create-invalidation \
